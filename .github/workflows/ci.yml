name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Rodar testes unitários
        run: >
          dotnet test tests/PrimaFoods.Abate.UnitTests
          --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-unitarios
          path: TestResults/*.trx
          if-no-files-found: warn

  integration-tests:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      # Os testes sobem um SQL Server com Testcontainers; o runner já traz o Docker.
      - name: Rodar testes de integração
        run: >
          dotnet test tests/PrimaFoods.Abate.IntegrationTests
          --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-integracao
          path: TestResults/*.trx
          if-no-files-found: warn
